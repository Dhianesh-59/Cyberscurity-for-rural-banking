
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Money | RuralBank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #172b4d;
            background: #f1f5fb;
        }

        .topbar {
            height: 72px;
            padding: 0 7%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }

        .logo {
            color: #0759b8;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-link {
            color: #0759b8;
            text-decoration: none;
            font-weight: bold;
        }

        .page {
            min-height: calc(100vh - 72px);
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f1f5fb, #e3edfa);
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 34px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e0e7f0;
            box-shadow: 0 15px 40px rgba(24,47,80,.12);
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f1;
            color: #dc3545;
            border-radius: 50%;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            color: #12233f;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }

        .account, .balance {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .account {
            background: #f4f8ff;
            border: 1px solid #dce8f5;
        }

        .balance {
            background: #eaf8f0;
            border: 1px solid #ccebd9;
            margin-bottom: 24px;
        }

        .account span, .balance span {
            display: block;
            margin-bottom: 6px;
            color: #68788f;
            font-size: 12px;
        }

        .account strong {
            overflow-wrap: anywhere;
        }

        .balance strong {
            color: #198754;
            font-size: 27px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            color: #172033;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220,53,69,.12);
        }

        .withdraw-button {
            width: 100%;
            height: 50px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #dc3545;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .withdraw-button:hover {
            background: #b02a37;
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fff0f1;
            border: 1px solid #fecdd3;
            color: #be123c;
        }

        .security {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f1f7ff;
            color: #52647a;
            text-align: center;
            font-size: 12px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0759b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 520px) {
            .topbar {
                padding: 0 18px;
            }

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <nav class="topbar">
        <a href="/dashboard" class="logo">RuralBank</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
    </nav>

    <main class="page">
        <section class="card">
            <div class="heading">
                <div class="icon">−</div>
                <h1>Withdraw Money</h1>
                <p class="subtitle">
                    Withdraw money securely from your bank account.
                </p>
            </div>

            <div class="account">
                <span>Account Number</span>
                <strong>{{ account_number }}</strong>
            </div>

            <div class="balance">
                <span>Available Balance</span>
                <strong>₹{{ balance }}</strong>
            </div>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/withdraw">
                <div class="field">
                    <label for="amount">Amount to Withdraw (₹)</label>
                    <input type="number"
                           id="amount"
                           name="amount"
                           placeholder="Enter amount"
                           step="0.01"
                           min="0.01"
                           required>
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <input type="text"
                           id="description"
                           name="description"
                           placeholder="Cash Withdrawal">
                </div>

                <button type="submit" class="withdraw-button">
                    Withdraw Money
                </button>
            </form>

            <div class="security">
                Secure banking transaction
            </div>

            <a href="/dashboard" class="back">
                ← Back to Dashboard
            </a>
        </section>
    </main>
</body>
</html>
